schema_version: 1
verified_at: 2026-07-23

status_definitions:
  ACTIVE_DIRECT: Verified public collector is enabled.
  ACTIVE_GMAIL_ALERT: Official or portal alerts are ingested through user-authorized Gmail.
  ACTIVE_PUBLIC_NOTICE: Official recruitment notices, advertisements, corrigenda and PDFs are monitored.
  ACTIVE_MANUAL_IMPORT: Official vacancies are retained through PDF, Word, EML, text or image import.
  STAGED_NEEDS_LIVE_PROOF: Official source is identified but automated extraction is not enabled until live proof passes.
  BLOCKED_RESTRICTED: Source exists but safe permitted automation is unavailable.
  NO_SOURCE_FOUND: No reliable official vacancy source has been identified.

