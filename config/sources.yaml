    profile_filter: true
    allowed_domains:
      - jobs.bechtel.com
    job_link_patterns:
      - /job/
    anchor_text_patterns: *global_profile_terms
    page_url_template: https://jobs.bechtel.com/go/Engineering/399431/{page}/?q=&sortColumn=referencedate&sortDirection=desc
    page_start: 0
    page_step: 25
    fetch_details: true
    deny_on_robots_error: true
    timeout_seconds: 30
    rate_limit_per_minute: 12
    max_response_bytes: 5000000
    max_items: 150
    max_pages: 12

