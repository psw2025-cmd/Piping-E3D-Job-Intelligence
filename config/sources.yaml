# Public-source registry.
# Never place credentials, private portals, cookies, CV data or recruiter lists here.
# Enabled sources must be official, public, read-only and protected by profile filtering.
sources:
  - id: mcdermott_oracle
    name: McDermott official Oracle careers
    type: oracle_hcm
    company: McDermott
    base_url: https://edsv.fa.us2.oraclecloud.com
    site_number: CX_1
    enabled: true
    profile_filter: true
    include_terms:
      - piping
      - pipe layout
      - plant layout
      - plant design
      - e3d
      - aveva e3d
      - pdms
      - sp3d
      - smartplant 3d
      - pipe support
      - piping stress
      - piping materials
      - 3d model
    location_terms: []
    timeout_seconds: 30
    rate_limit_per_minute: 60
    max_response_bytes: 5000000
    max_items: 300
    max_scan_items: 5000
    max_pages: 50
    page_size: 100

  - id: wood_oracle
    name: Wood official Oracle careers
    type: oracle_hcm
    company: Wood
    base_url: https://ehif.fa.em2.oraclecloud.com
    site_number: CX_1
    enabled: true
    profile_filter: true
    include_terms:
      - piping
      - pipe layout
      - plant layout
      - plant design
      - e3d
      - aveva e3d
      - pdms
      - sp3d
      - smartplant 3d
      - pipe support
      - piping stress
      - piping materials
      - 3d model
    location_terms: []
    timeout_seconds: 30
    rate_limit_per_minute: 60
    max_response_bytes: 5000000
    max_items: 300
    max_scan_items: 5000
    max_pages: 50
    page_size: 100

  - id: petrofac_public_html
    name: Petrofac official SelectMinds careers
    type: public_html
    company: Petrofac
    url: https://petrofac.referrals.selectminds.com/latest-jobs
    enabled: true
    profile_filter: true
    allowed_domains:
      - petrofac.referrals.selectminds.com
    job_link_patterns:
      - /jobs/
    anchor_text_patterns:
      - piping
      - pipe support
      - plant layout
      - plant design
      - e3d
      - pdms
      - sp3d
      - 3d model
    exclude_anchor_text_patterns:
      - sign up
      - login
      - job alerts
    fetch_details: true
    deny_on_robots_error: true
    timeout_seconds: 30
    rate_limit_per_minute: 15
    max_response_bytes: 5000000
    max_items: 100
    max_pages: 1

  - id: bechtel_engineering_html
    name: Bechtel official engineering careers
    type: public_html
    company: Bechtel
    url: https://jobs.bechtel.com/go/Engineering/399431
    enabled: true
    profile_filter: true
    allowed_domains:
      - jobs.bechtel.com
    job_link_patterns:
      - /job/
    anchor_text_patterns:
      - piping
      - pipe support
      - plant design
      - plant layout
      - layout designer
      - e3d
      - pdms
      - sp3d
    page_url_template: https://jobs.bechtel.com/go/Engineering/399431/{page}/?q=&sortColumn=referencedate&sortDirection=desc
    page_start: 0
    page_step: 25
    fetch_details: true
    deny_on_robots_error: true
    timeout_seconds: 30
    rate_limit_per_minute: 12
    max_response_bytes: 5000000
    max_items: 150
    max_pages: 12

  - id: example_greenhouse
    name: Example Greenhouse board
    type: greenhouse
    company: Example EPC
    board_token: replace-with-public-board-token
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500

  - id: example_lever
    name: Example Lever site
    type: lever
    company: Example EPC
    site: replace-with-public-site-name
    region: global
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500
    page_size: 100

  - id: example_smartrecruiters
    name: Example SmartRecruiters company
    type: smartrecruiters
    company: Example EPC
    company_identifier: replace-with-public-company-identifier
    enabled: false
    profile_filter: true
    fetch_details: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 300
    page_size: 100

  - id: example_rss
    name: Example public jobs RSS feed
    type: rss
    company: Example EPC
    url: https://example.com/jobs.rss
    location: ""
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 500

  - id: example_sitemap
    name: Example public careers sitemap
    type: sitemap
    company: Example EPC
    url: https://example.com/jobs-sitemap.xml
    allowed_domains:
      - example.com
    job_url_patterns:
      - /careers/
      - /jobs/
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 300
    max_sitemaps: 20
    deny_on_robots_error: true

policy:
  respect_robots_txt: true
  skip_login_required_pages: true
  bypass_captcha: false
  use_rotating_proxies: false
  retain_source_evidence: true
