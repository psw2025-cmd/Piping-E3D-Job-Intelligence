    max_scan_items: 3000
    max_pages: 30
    page_size: 100

  - id: technip_energies_oracle
    name: Technip Energies official Oracle careers
    type: oracle_hcm
    company: Technip Energies
    base_url: https://hcxg.fa.em2.oraclecloud.com
    site_number: CX_1
    enabled: true
    include_terms:
      - piping
      - pipe layout
      - plant layout
      - e3d
      - pdms
      - sp3d
      - smart 3d
      - pipe support
      - field piping
      - offshore piping
