# Worldwide public-source registry.
# Never place credentials, private portals, cookies, CV data or recruiter lists here.
# Enabled sources must be official, public, read-only and protected by profile filtering.
sources:
  - id: mcdermott_oracle
    name: McDermott official Oracle careers
    type: oracle_hcm
    company: McDermott
    base_url: https://edsv.fa.us2.oraclecloud.com
    site_number: CX_1
    enabled: true
    profile_filter: true
    include_terms: &global_profile_terms
      - piping
      - pipe layout
      - plant layout
      - plant design
      - e3d
      - aveva e3d
      - pdms
      - sp3d
      - smartplant 3d
      - pipe support
      - piping stress
      - piping materials
      - 3d model
    location_terms: []
    timeout_seconds: 30
    rate_limit_per_minute: 60
    max_response_bytes: 5000000
    max_items: 300
    max_scan_items: 5000
    max_pages: 50
    page_size: 100

  - id: wood_oracle
    name: Wood official Oracle careers
    type: oracle_hcm
    company: Wood
    base_url: https://ehif.fa.em2.oraclecloud.com
    site_number: CX_1
    enabled: true
    profile_filter: true
    include_terms: *global_profile_terms
    location_terms: []
    timeout_seconds: 30
    rate_limit_per_minute: 60
    max_response_bytes: 5000000
    max_items: 300
    max_scan_items: 5000
    max_pages: 50
    page_size: 100

  - id: petrofac_selectminds_html
    name: Petrofac official SelectMinds careers
    type: public_html
    company: Petrofac
    platform: selectminds
    url: https://petrofac.referrals.selectminds.com/latest-jobs
    enabled: true
    profile_filter: true
    allowed_domains:
      - petrofac.referrals.selectminds.com
    job_link_patterns:
      - /jobs/
    anchor_text_patterns: *global_profile_terms
    exclude_anchor_text_patterns:
      - sign up
      - login
      - job alerts
    fetch_details: true
    deny_on_robots_error: true
    timeout_seconds: 30
    rate_limit_per_minute: 15
    max_response_bytes: 5000000
    max_items: 100
    max_pages: 1

  - id: bechtel_successfactors_html
