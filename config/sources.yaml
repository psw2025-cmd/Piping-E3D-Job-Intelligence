  - id: bechtel_successfactors
    name: Bechtel official SAP SuccessFactors careers
    type: successfactors
    company: Bechtel
    page_url_template: "https://jobs.bechtel.com/search/?q=piping&locationsearch=&sortColumn=referencedate&sortDirection=desc&startrow={offset}"
    job_link_pattern: /job/
    enabled: true
    include_terms:
      - piping
      - pipe support
      - plant design
      - plant layout
      - e3d
      - pdms
      - sp3d
      - smart 3d
      - field engineer
      - piping designer
    location_terms: []
    closed_text_patterns:
      - job you are trying to apply for has been filled
      - position is no longer available
      - job is no longer available
    page_size: 25
    max_pages: 12
    max_items: 250
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_response_bytes: 8000000
    max_redirects: 5

  - id: petrofac_selectminds
    name: Petrofac official SelectMinds careers
    type: selectminds
    company: Petrofac
    url: https://petrofac.referrals.selectminds.com/latest-jobs
    additional_urls:
      - https://petrofac.referrals.selectminds.com/hot-jobs
      - https://petrofac.referrals.selectminds.com/location/india-opportunities-at-petrofac-280
    job_link_pattern: /jobs/
    enabled: true
    include_terms:
      - piping
      - piping designer
      - plant layout
      - e3d
      - pdms
      - sp3d
      - pipe support
      - construction piping
      - commissioning mechanical
      - field engineer
    location_terms: []
    closed_text_patterns:
      - unfortunately this position has been closed
      - job you are trying to apply for has been filled
      - position is no longer available
    max_pages: 3
    max_items: 200
    timeout_seconds: 30
    rate_limit_per_minute: 15
    max_response_bytes: 8000000
    max_redirects: 5

  - id: example_greenhouse
    name: Example Greenhouse board
    type: greenhouse
    company: Example EPC
    board_token: replace-with-public-board-token
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500

  - id: example_lever
    name: Example Lever site
    type: lever
    company: Example EPC
    site: replace-with-public-site-name
    region: global
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500
    page_size: 100

  - id: example_smartrecruiters
    name: Example SmartRecruiters company
    type: smartrecruiters
    company: Example EPC
    company_identifier: replace-with-public-company-identifier
    enabled: false
    fetch_details: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 300
    page_size: 100

  - id: example_rss
    name: Example public jobs RSS feed
    type: rss
    company: Example EPC
    url: https://example.com/jobs.rss
    location: ""
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 500

  - id: example_sitemap
    name: Example public careers sitemap
    type: sitemap
    company: Example EPC
    url: https://example.com/jobs-sitemap.xml
    allowed_domains:
      - example.com
    job_url_patterns:
      - /careers/
      - /jobs/
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 300
    max_sitemaps: 20
    deny_on_robots_error: true

policy:
  respect_robots_txt: true
  skip_login_required_pages: true
  bypass_captcha: false
  use_rotating_proxies: false
  retain_source_evidence: true
