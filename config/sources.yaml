# Public-source registry.
# Never place credentials, private portals, cookies, CV data or recruiter lists here.
# McDermott and Wood Oracle sources were verified read-only on 2026-07-23.
sources:
  - id: mcdermott_oracle
    name: McDermott official Oracle careers
    type: oracle_hcm
    company: McDermott
    base_url: https://edsv.fa.us2.oraclecloud.com
    site_number: CX_1
    enabled: true
    include_terms:
      - piping
      - e3d
      - pdms
      - plant layout
      - pipe support
    location_terms:
      - india
      - united arab emirates
      - qatar
      - saudi arabia
      - oman
      - kuwait
      - bahrain
      - malaysia
      - singapore
    timeout_seconds: 30
    rate_limit_per_minute: 60
    max_response_bytes: 5000000
    max_items: 250
    max_scan_items: 3000
    max_pages: 30
    page_size: 100

  - id: wood_oracle
    name: Wood official Oracle careers
    type: oracle_hcm
    company: Wood
    base_url: https://ehif.fa.em2.oraclecloud.com
    site_number: CX_1
    enabled: true
    include_terms:
      - piping
      - e3d
      - pdms
      - plant layout
      - pipe support
    location_terms:
      - india
      - united arab emirates
      - qatar
      - saudi arabia
      - oman
      - kuwait
      - bahrain
      - malaysia
      - singapore
    timeout_seconds: 30
    rate_limit_per_minute: 60
    max_response_bytes: 5000000
    max_items: 250
    max_scan_items: 3000
    max_pages: 30
    page_size: 100

  - id: example_greenhouse
    name: Example Greenhouse board
    type: greenhouse
    company: Example EPC
    board_token: replace-with-public-board-token
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500

  - id: example_lever
    name: Example Lever site
    type: lever
    company: Example EPC
    site: replace-with-public-site-name
    region: global
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500
    page_size: 100

  - id: example_smartrecruiters
    name: Example SmartRecruiters company
    type: smartrecruiters
    company: Example EPC
    company_identifier: replace-with-public-company-identifier
    enabled: false
    fetch_details: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 300
    page_size: 100

  - id: example_rss
    name: Example public jobs RSS feed
    type: rss
    company: Example EPC
    url: https://example.com/jobs.rss
    location: ""
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 500

  - id: example_sitemap
    name: Example public careers sitemap
    type: sitemap
    company: Example EPC
    url: https://example.com/jobs-sitemap.xml
    allowed_domains:
      - example.com
    job_url_patterns:
      - /careers/
      - /jobs/
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 300
    max_sitemaps: 20
    deny_on_robots_error: true

policy:
  respect_robots_txt: true
  skip_login_required_pages: true
  bypass_captcha: false
  use_rotating_proxies: false
  retain_source_evidence: true
