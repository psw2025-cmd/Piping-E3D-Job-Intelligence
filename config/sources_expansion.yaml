# Additive public sources loaded with config/sources.yaml.
# Public SmartRecruiters tenants were verified from current official job postings on 2026-07-23.
sources:
  - id: ramboll_smartrecruiters
    name: Ramboll official SmartRecruiters careers
    type: smartrecruiters
    company: Ramboll
    company_identifier: Ramboll3
    enabled: true
    profile_filter: true
    include_terms: &expanded_profile_terms
      - piping
      - pipe layout
      - plant layout
      - plant design
      - e3d
      - aveva e3d
      - pdms
      - sp3d
      - smart 3d
      - smartplant 3d
      - pipe support
      - piping stress
      - piping materials
      - 3d model
    fetch_details: false
    timeout_seconds: 30
    rate_limit_per_minute: 30
    max_response_bytes: 5000000
    max_items: 500
    max_pages: 10
    page_size: 100

