# India public-sector recruitment notice sources.
# NPCIL is active in production after live proof; its disabled copy is retained
# here for repeatable contract testing. GAIL remains disabled until its bounded
# live proof workflow passes.
# EIL is intentionally excluded from direct automation because its official
# recruitment portal disallows this crawler through robots.txt. EIL remains
# covered through read-only Gmail alerts and private PDF/EML/image imports.
# IndianOil is intentionally excluded from direct automation because its
# official listing returns a JavaScript/Sucuri challenge to non-browser clients.
# IndianOil remains covered through read-only Gmail alerts and private imports.

sources:
  - id: npcil_public_notices
    name: NPCIL official opportunities and recruitment notices
    type: public_notice
    company: Nuclear Power Corporation of India
    url: https://www.npcil.nic.in/content/289_1_Opportunities.aspx
    allowed_domains:
      - www.npcil.nic.in
    notice_link_patterns:
      - /content/
      - /WriteReadData/
      - .pdf
    include_notice_terms:
      - recruitment
      - advertisement
      - engagement
      - apprentice
      - corrigendum
      - postponed
      - extension
    exclude_notice_terms:
      - result
      - selected candidates
      - shortlist
      - admit card
      - interview schedule
    include_followup_notices: false
    country: India
    location: India
    sector: Nuclear
    profile_filter: true
    deny_on_robots_error: true
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 100
    max_pdf_pages: 50
    max_response_bytes: 15000000
    max_redirects: 5

  - id: gail_public_notices
    name: GAIL official vacancies and recruitment notices
    type: public_notice
    company: GAIL India
    url: https://gailonline.com/Vacancies.html
    allowed_domains:
      - gailonline.com
      - www.gailonline.com
    notice_link_patterns:
      - .pdf
      - /downloads/
      - /Download/
      - /Vacancies/
      - /currentOpnning/
      - /current-opening/
      - /final_site/
    include_notice_terms:
      - career opportunities
      - recruitment
      - requirement
      - engagement
      - advertisement
      - executive trainee
      - various disciplines
      - walk-in
      - corrigendum
      - extension
    exclude_notice_terms:
      - shortlisted candidate
      - final result
      - result
      - admit card
      - mock test
      - medical examination
      - selected candidates
    include_followup_notices: false
    country: India
    location: India
    sector: Gas; Pipelines; Petrochemical; LNG; Oil and Gas
    profile_filter: true
    deny_on_robots_error: true
    enabled: false
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 20
    max_pdf_pages: 20
    max_response_bytes: 15000000
    max_redirects: 5

policy:
  respect_robots_txt: true
  skip_login_required_pages: true
  bypass_captcha: false
  use_rotating_proxies: false
  retain_source_evidence: true
