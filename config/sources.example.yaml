# Copy a verified public source into config/sources.yaml only after confirming
# employer ownership, public accessibility and conservative request limits.

sources:
  - id: example_oracle_hcm
    name: Example Oracle Candidate Experience source
    type: oracle_hcm
    company: Example EPC
    base_url: https://example.fa.oraclecloud.com
    site_number: CX_1
    include_terms: [piping, e3d, pdms]
    location_terms: []
    profile_filter: true
    enabled: false
    page_size: 100
    max_pages: 20
    max_scan_items: 2000
    max_items: 200
    timeout_seconds: 30
    rate_limit_per_minute: 30

  - id: example_workday
    name: Example Workday candidate source
    type: workday
    company: Example EPC
    base_url: https://example.wd5.myworkdayjobs.com
    tenant: example
    site: Careers
    locale: en-US
    search_terms: [piping, e3d, pdms]
    include_terms: [piping, e3d, pdms]
    location_terms: []
    profile_filter: true
    enabled: false
    page_size: 20
    max_pages: 20
    max_scan_items: 2000
    max_items: 200
    timeout_seconds: 30
    rate_limit_per_minute: 20

  - id: example_card_html
    name: Example context-card public job board
    type: card_html
    company: Example EPC
    url: https://jobs.example.com/
    allowed_domains:
      - jobs.example.com
    job_link_patterns:
      - jobid=
    include_terms:
      - piping
      - e3d
      - pdms
    location_terms: []
    exclude_terms:
      - pipefitter
    closed_text_patterns:
      - position is no longer available
      - vacancy has been closed
    deny_on_robots_error: true
    profile_filter: true
    enabled: false
    max_pages: 1
    max_items: 200
    timeout_seconds: 30
    rate_limit_per_minute: 10

  - id: example_greenhouse
    name: Example Greenhouse board
    type: greenhouse
    company: Example EPC
    board_token: replace-with-public-board-token
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500

  - id: example_lever
    name: Example Lever site
    type: lever
    company: Example EPC
    site: replace-with-public-site-name
    region: global
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 500
    page_size: 100

  - id: example_smartrecruiters
    name: Example SmartRecruiters company
    type: smartrecruiters
    company: Example EPC
    company_identifier: replace-with-public-company-identifier
    enabled: false
    profile_filter: true
    fetch_details: true
    timeout_seconds: 30
    rate_limit_per_minute: 20
    max_items: 300
    page_size: 100

  - id: example_rss
    name: Example public jobs RSS feed
    type: rss
    company: Example EPC
    url: https://example.com/jobs.rss
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 500

  - id: example_sitemap
    name: Example public careers sitemap
    type: sitemap
    company: Example EPC
    url: https://example.com/jobs-sitemap.xml
    allowed_domains:
      - example.com
    job_url_patterns:
      - /careers/
      - /jobs/
    enabled: false
    profile_filter: true
    timeout_seconds: 30
    rate_limit_per_minute: 10
    max_items: 300
    max_sitemaps: 20
    deny_on_robots_error: true

  - id: example_public_html
    name: Example public employer search
    type: public_html
    company: Example EPC
    url: https://example.com/careers?page=0
    page_url_template: https://example.com/careers?page={page}
    page_start: 0
    page_step: 1
    max_pages: 3
    allowed_domains:
      - example.com
      - jobs.example-ats.com
    job_link_patterns:
      - /job/
    anchor_text_patterns:
      - Piping
      - E3D
      - PDMS
    required_anchor_text_patterns:
      - India
    exclude_anchor_text_patterns:
      - Hot Job
    enabled: false
    profile_filter: true
    fetch_details: true
    deny_on_robots_error: true
    timeout_seconds: 30
    rate_limit_per_minute: 6
    max_items: 100

policy:
  respect_robots_txt: true
  skip_login_required_pages: true
  bypass_captcha: false
  use_rotating_proxies: false
  retain_source_evidence: true
