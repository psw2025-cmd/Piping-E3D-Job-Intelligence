schema_version: 1
verified_at: 2026-07-23
principles:
  - Use official public pages, permitted feeds or documented APIs only.
  - Never bypass login, CAPTCHA, robots.txt or access controls.
  - Keep unproven sources disabled until live extraction and evidence proof pass.
connectors:
  - {platform: Oracle HCM Candidate Experience, source_type: oracle_hcm, implementation: native, access: public read-only requisition endpoint, active_examples: [McDermott, Wood]}
  - {platform: Greenhouse, source_type: greenhouse, implementation: native, access: public board API}
  - {platform: Lever, source_type: lever, implementation: native, access: public postings API}
  - {platform: SmartRecruiters, source_type: smartrecruiters, implementation: native, access: public postings API}
  - {platform: SAP SuccessFactors Jobs2Web, source_type: public_html, implementation: bounded public listing and detail crawler, active_examples: [Bechtel]}
  - {platform: SelectMinds, source_type: public_html, implementation: bounded public listing and detail crawler, active_examples: [Petrofac]}
  - {platform: Eightfold, source_type: public_html, implementation: rendered public listing and detail crawler, active_examples: [Worley], staged_examples: [Fluor]}
  - {platform: Phenom, source_type: public_html, implementation: bounded public listing and detail crawler, staged_examples: [KBR]}
  - {platform: Workday, source_type: public_html_or_sitemap, implementation: public career page and sitemap fallback, access: no undocumented tenant API usage}
  - {platform: iCIMS, source_type: public_html_or_documented_api, implementation: public portal HTML or authorized documented API}
  - {platform: Taleo, source_type: public_html_or_rss, implementation: public careersection pages, sitemap or feed}
  - {platform: Teamtailor, source_type: public_html_or_documented_api, implementation: public job pages or documented API}
  - {platform: Workable, source_type: public_html_or_documented_api, implementation: public job pages or documented API}
  - {platform: Ashby, source_type: public_html_or_documented_api, implementation: public job pages or documented API}
fallback_order:
  - native documented public API
  - official XML, RSS or sitemap
  - bounded official public HTML
  - user-authorized Gmail job alerts
  - private PDF, Word, EML or image import
