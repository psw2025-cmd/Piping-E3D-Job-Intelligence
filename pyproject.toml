[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piping-e3d-job-intelligence"
version = "0.5.0"
description = "Local-first job intelligence and tracking for piping, E3D, PDMS, offshore and EPC roles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "defusedxml>=0.7.1",
  "feedparser>=6.0.12",
  "google-api-python-client>=2.176.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.2",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "Pillow>=11.0.0",
  "pypdf>=6.12.0",
  "pytesseract>=0.3.13",
  "python-docx>=1.2.0",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.3",
]

[project.scripts]
job-intel = "job_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
