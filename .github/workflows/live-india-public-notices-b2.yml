name: live-india-public-notices-b2

on:
  pull_request:
    branches: [main]
    paths:
      - "config/sources.india-notices.yaml"
      - "tests/test_public_notice_config.py"
      - ".github/workflows/live-india-public-notices-b2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-india-public-notices-b2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-eil-gail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate staged source contracts
        run: |
          ruff check tests/test_public_notice_config.py
          pytest -q tests/test_public_notice.py tests/test_public_notice_config.py
          job-intel validate-sources --sources config/sources.india-notices.yaml

      - name: Live EIL and GAIL contract proof
        run: |
          python scripts/verify_live_notice_sources.py \
            --config config/sources.india-notices.yaml \
            --only eil_public_notices \
            --only gail_public_notices \
            --output output/live-india-notices-b2 \
            --max-notices 3 \
            --max-pdf-pages 10 \
            --min-notices 1

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          if [ -f output/live-india-notices-b2/SUMMARY.md ]; then
            cat output/live-india-notices-b2/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Batch-2 notice proof did not create SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-india-notices-b2-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/live-india-notices-b2
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Enforce source-level results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/live-india-notices-b2/status.json")
          if not path.exists():
              raise SystemExit("Batch-2 proof did not create status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          results = {item["source_id"]: item for item in status.get("results", [])}
          expected = {"eil_public_notices", "gail_public_notices"}
          if set(results) != expected:
              raise SystemExit(f"Unexpected source result set: {results}")
          failed = {
              source_id: result
              for source_id, result in results.items()
              if result.get("status") != "pass"
          }
          if failed:
              raise SystemExit(f"Staged source proof failed: {failed}")
          print("PASS: EIL and GAIL staged notice sources passed live proof")
          PY
