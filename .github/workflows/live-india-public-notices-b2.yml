name: live-india-public-notices-b2

on:
  pull_request:
    branches: [main]
    paths:
      - "src/job_intelligence/collectors/public_notice_adaptive.py"
      - "src/job_intelligence/collectors/__init__.py"
      - "scripts/verify_live_notice_sources.py"
      - "config/sources.india-notices.yaml"
      - "config/employer_registry.d/**"
      - "config/worldwide_companies.d/**"
      - "tests/test_public_notice_adaptive.py"
      - "tests/test_public_notice_config.py"
      - ".github/workflows/live-india-public-notices-b2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-india-public-notices-b2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-gail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate adaptive notice contract
        run: |
          ruff check \
            src/job_intelligence/collectors/public_notice_adaptive.py \
            scripts/verify_live_notice_sources.py \
            tests/test_public_notice_adaptive.py \
            tests/test_public_notice_config.py
          pytest -q \
            tests/test_public_notice.py \
            tests/test_public_notice_adaptive.py \
            tests/test_public_notice_config.py
          job-intel validate-sources --sources config/sources.india-notices.yaml

      - name: Live GAIL contract proof
        run: |
          python scripts/verify_live_notice_sources.py \
            --config config/sources.india-notices.yaml \
            --only gail_public_notices \
            --output output/live-india-notices-b2 \
            --max-notices 3 \
            --max-pdf-pages 10 \
            --min-notices 1

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          if [ -f output/live-india-notices-b2/SUMMARY.md ]; then
            cat output/live-india-notices-b2/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Batch-2 notice proof did not create SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-india-notices-b2-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/live-india-notices-b2
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Enforce GAIL result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/live-india-notices-b2/status.json")
          if not path.exists():
              raise SystemExit("GAIL proof did not create status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          results = {item["source_id"]: item for item in status.get("results", [])}
          if set(results) != {"gail_public_notices"}:
              raise SystemExit(f"Unexpected source result set: {results}")
          result = results["gail_public_notices"]
          if result.get("status") != "pass":
              raise SystemExit(f"GAIL staged source proof failed: {result}")
          print("PASS: GAIL staged public-notice source passed live proof")
          PY
