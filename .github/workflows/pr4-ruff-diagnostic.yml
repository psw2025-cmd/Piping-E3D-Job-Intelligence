name: pr4-ruff-diagnostic

on:
  push:
    branches:
      - agent/public-source-collectors

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-source-collectors
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Capture exact Ruff findings
        shell: bash
        run: |
          set +e
          ruff check src tests --output-format=concise > pr4_ruff_diagnostic.txt 2>&1
          rc=$?
          echo "RUFF_RC=$rc" >> pr4_ruff_diagnostic.txt
          cat pr4_ruff_diagnostic.txt
          rm .github/workflows/pr4-ruff-diagnostic.yml

      - name: Commit diagnostic only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr4_ruff_diagnostic.txt .github/workflows/pr4-ruff-diagnostic.yml
          git commit -m "WIP: capture PR #4 Ruff diagnostics"
          git push origin HEAD:agent/public-source-collectors
