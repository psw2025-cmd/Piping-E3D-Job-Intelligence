name: live-india-public-notices

on:
  pull_request:
    branches: [main]
    paths:
      - "src/job_intelligence/collectors/public_notice.py"
      - "src/job_intelligence/source_config.py"
      - "config/sources.india-notices.yaml"
      - "scripts/verify_live_notice_sources.py"
      - "tests/test_public_notice*.py"
      - ".github/workflows/live-india-public-notices.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-india-public-notices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff and notice tests
        run: |
          ruff check \
            src/job_intelligence/collectors/public_notice.py \
            scripts/verify_live_notice_sources.py \
            tests/test_public_notice.py \
            tests/test_public_notice_config.py
          pytest -q tests/test_public_notice.py tests/test_public_notice_config.py

      - name: Live official notice contract proof
        run: |
          python scripts/verify_live_notice_sources.py \
            --config config/sources.india-notices.yaml \
            --output output/live-india-notices \
            --max-notices 3 \
            --max-pdf-pages 10 \
            --min-notices 1

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          if [ -f output/live-india-notices/SUMMARY.md ]; then
            cat output/live-india-notices/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live notice proof did not create SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload live proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-india-notices-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/live-india-notices
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Enforce verified proof
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/live-india-notices/status.json")
          if not path.exists():
              raise SystemExit("Live notice proof did not create status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          if status.get("verified") is not True:
              raise SystemExit(
                  f"Live notice proof failed: {status.get('results')}"
              )
          if status.get("sources_passed") != status.get("sources_attempted"):
              raise SystemExit("Not every notice source passed")
          print("PASS: every staged India notice source passed live proof")
          PY
