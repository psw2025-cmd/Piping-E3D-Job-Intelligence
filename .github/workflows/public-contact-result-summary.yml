name: public-contact-result-summary

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Download verified raw result
        uses: actions/download-artifact@v4
        with:
          name: Global-Official-Hiring-Contacts-Full
          path: tmp/result
          run-id: 30170526306
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final quality gate
        run: |
          job-contact-finalize --output tmp/result
          test -s tmp/result/Global_Official_Hiring_Contacts.xlsx
          test -s tmp/result/All_Official_Contacts.csv
          test -s tmp/result/Official_Job_Mailboxes.csv
          test -s tmp/result/Official_General_Mailboxes.csv
          test -s tmp/result/Excluded_Quality.csv
          test -s tmp/result/summary.json
          test -s tmp/result/Global_Official_Hiring_Contacts_Bundle.zip

      - name: Prepare concise contact listings
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          root = Path("tmp/result")
          fields = (
              "organization",
              "organization_aliases",
              "record_type",
              "country",
              "email",
              "mailbox_type",
              "verification_status",
              "mail_route_status",
              "source_urls",
              "source_url",
              "duplicate_source_count",
          )

          def write_listing(input_name: str, output_name: str, heading: str) -> None:
              rows = []
              with (root / input_name).open(encoding="utf-8-sig", newline="") as handle:
                  for row in csv.DictReader(handle):
                      rows.append({field: str(row.get(field, "")).strip() for field in fields})
              rows.sort(key=lambda row: (row["organization"].casefold(), row["email"]))
              lines = [f"# {heading}", "", f"Total unique emails: **{len(rows)}**", ""]
              for index, row in enumerate(rows, start=1):
                  source = row["source_urls"] or row["source_url"]
                  lines.extend(
                      [
                          f"## {index}. {row['organization']}",
                          f"- Email: `{row['email']}`",
                          f"- Type: `{row['mailbox_type']}`",
                          f"- Status: `{row['verification_status']}`",
                          f"- DNS: `{row['mail_route_status']}`",
                          f"- Country: {row['country']}",
                          f"- Aliases: {row['organization_aliases']}",
                          f"- Duplicate source rows merged: {row['duplicate_source_count']}",
                          f"- Sources: {source}",
                          "",
                      ]
                  )
              Path(output_name).write_text("\n".join(lines), encoding="utf-8")

          write_listing(
              "Official_Job_Mailboxes.csv",
              "tmp/job_mailboxes_final.md",
              "Final official job and recruitment mailboxes",
          )
          write_listing(
              "Official_General_Mailboxes.csv",
              "tmp/general_mailboxes_final.md",
              "Final official general business mailboxes",
          )
          print(json.dumps(json.loads((root / "summary.json").read_text()), indent=2))

      - name: Publish final summary and listings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join('tmp', 'result', 'summary.json');
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const body = `<!-- public-contact-final-quality-summary -->
            ## Final quality-gated global contact result

            \`\`\`json
            ${JSON.stringify(summary, null, 2)}
            \`\`\`

            Raw public-source scan workflow run: \`30170526306\`.
            `;
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              }
            );

            async function upsertIssue(title, issueBody) {
              const existing = openIssues.find(issue =>
                !issue.pull_request && issue.title === title
              );
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: issueBody,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: issueBody,
                });
              }
            }

            await upsertIssue('Final verified public contact result 30170526306', body);
            await upsertIssue(
              'Final official job mailboxes 30170526306',
              fs.readFileSync('tmp/job_mailboxes_final.md', 'utf8')
            );
            await upsertIssue(
              'Final official general mailboxes 30170526306',
              fs.readFileSync('tmp/general_mailboxes_final.md', 'utf8')
            );

      - name: Upload final cleaned package
        uses: actions/upload-artifact@v4
        with:
          name: Global-Official-Hiring-Contacts-Final
          path: tmp/result/
          if-no-files-found: error
          retention-days: 30
