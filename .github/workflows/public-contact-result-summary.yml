name: public-contact-result-summary

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified full result
        uses: actions/download-artifact@v4
        with:
          name: Global-Official-Hiring-Contacts-Full
          path: tmp/result
          run-id: 30170526306
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join('tmp', 'result', 'summary.json');
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const body = `<!-- public-contact-final-summary -->
            ## Verified full global contact result

            \`\`\`json
            ${JSON.stringify(summary, null, 2)}
            \`\`\`

            Artifact source workflow run: \`30170526306\`.
            `;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(comment =>
              comment.body && comment.body.includes('<!-- public-contact-final-summary -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
            const title = 'Verified public contact result 30170526306';
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              }
            );
            const resultIssue = openIssues.find(issue =>
              !issue.pull_request && issue.title === title
            );
            if (resultIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: resultIssue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
