name: integrate-employer-registry

on:
  push:
    branches:
      - agent/integrate-employer-registry

permissions:
  contents: write

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main-based branch
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-employer-registry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bring forward only isolated employer-registry work
        shell: bash
        run: |
          git fetch origin agent/verified-employer-registry
          git checkout origin/agent/verified-employer-registry -- \
            config/employer_registry.yaml \
            config/sources.example.yaml \
            src/job_intelligence/collectors/public_html.py \
            tests/test_employer_registry.py \
            tests/test_public_html.py \
            tests/test_public_html_resilience.py

      - name: Integrate with current main and fix review findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one match in {path}, found {count}: {old[:100]!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("config/employer_registry.yaml").write_text(
              '''schema_version: 1
          verified_at: 2026-07-23

          status_definitions:
            active_supported: Verified public source configured and enabled.
            official_site_verified: Official employer careers site verified; connector research remains.
            connector_planned: Public job portal verified; a constrained connector is planned.
            restricted_endpoint_not_used: A platform endpoint exists but is not documented for public third-party use.

          employers:
            - company: McDermott
              priority: 1
              official_careers_url: https://www.mcdermott.com/careers/search-apply
              public_job_host: edsv.fa.us2.oraclecloud.com
              status: active_supported
              source_ids:
                - mcdermott_oracle
              notes: Verified public Oracle Candidate Experience requisition source with role and location filters.

            - company: Wood
              priority: 1
              official_careers_url: https://careers.woodplc.com/
              public_job_host: ehif.fa.em2.oraclecloud.com
              status: active_supported
              source_ids:
                - wood_oracle
              notes: Verified public Oracle Candidate Experience requisition source with role and location filters.

            - company: Worley
              priority: 1
              official_careers_url: https://www.worley.com/en/careers
              public_job_url: https://jobs.worley.com/careers
              status: connector_planned
              source_ids: []
              notes: Official public job search verified; connector must use documented and permitted public access only.

            - company: Bechtel
              priority: 1
              official_careers_url: https://www.bechtel.com/careers/
              public_job_url: https://jobs.bechtel.com/us/en
              status: connector_planned
              source_ids: []
              notes: Official public professional-job portal verified; connector remains disabled pending proof.

            - company: KBR
              priority: 1
              official_careers_url: https://careers.kbr.com/us/en
              public_job_url: https://careers.kbr.com/us/en/search-results
              status: connector_planned
              source_ids: []
              notes: Official public careers portal verified; platform-specific connector remains disabled.

            - company: Petrofac
              priority: 1
              official_careers_url: https://www.petrofac.com/careers/find-a-job-at-petrofac
              public_job_url: https://petrofac.referrals.selectminds.com/
              status: connector_planned
              source_ids: []
              notes: Official application portal verified; collector remains disabled pending proof.

            - company: Technip Energies
              priority: 1
              official_careers_url: https://careers.technipenergies.com/
              status: restricted_endpoint_not_used
              source_ids: []
              notes: Public rendered pages may be supported later; undocumented internal APIs will not be used.
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          # Cache robots failures so one unavailable robots.txt does not trigger a request per URL.
          replace_once(
              "src/job_intelligence/collectors/public_html.py",
              '''        self.cache: dict[str, RobotFileParser | None] = {}\n''',
              '''        self.cache: dict[str, RobotFileParser | None] = {}\n        self.denied_origins: set[str] = set()\n''',
          )
          replace_once(
              "src/job_intelligence/collectors/public_html.py",
              '''        if origin not in self.cache:\n            robots_url = f"{origin}/robots.txt"\n''',
              '''        if origin in self.denied_origins:\n            return False\n        if origin not in self.cache:\n            robots_url = f"{origin}/robots.txt"\n''',
          )
          replace_once(
              "src/job_intelligence/collectors/public_html.py",
              '''            except Exception:\n                if self.deny_on_error:\n                    return False\n                self.cache[origin] = None\n''',
              '''            except Exception:\n                if self.deny_on_error:\n                    self.denied_origins.add(origin)\n                    return False\n                self.cache[origin] = None\n''',
          )

          # Allow collectors to return non-fatal warnings.
          replace_once(
              "src/job_intelligence/collectors/common.py",
              '''class CollectionResult:\n    jobs: list[JobRecord] = field(default_factory=list)\n    evidence: list[EvidenceArtifact] = field(default_factory=list)\n''',
              '''class CollectionResult:\n    jobs: list[JobRecord] = field(default_factory=list)\n    evidence: list[EvidenceArtifact] = field(default_factory=list)\n    warnings: list[str] = field(default_factory=list)\n''',
          )

          # Register public_html without losing the verified Oracle collector.
          replace_once(
              "src/job_intelligence/collectors/__init__.py",
              '''from .oracle_hcm import collect_oracle_hcm\nfrom .rss import collect_rss\n''',
              '''from .oracle_hcm import collect_oracle_hcm\nfrom .public_html import collect_public_html\nfrom .rss import collect_rss\n''',
          )
          replace_once(
              "src/job_intelligence/collectors/__init__.py",
              '''    "Collector",\n    "collect_sitemap",\n''',
              '''    "Collector",\n    "collect_public_html",\n    "collect_sitemap",\n''',
          )

          # Merge public_html validation into the current Oracle-aware source schema.
          replace_once(
              "src/job_intelligence/source_config.py",
              '''    "oracle_hcm",\n    "smartrecruiters",\n''',
              '''    "oracle_hcm",\n    "public_html",\n    "smartrecruiters",\n''',
          )
          replace_once(
              "src/job_intelligence/source_config.py",
              '''_SITE_NUMBER_PATTERN = re.compile(r"^[A-Za-z0-9_-]{1,80}$")\n''',
              '''_SITE_NUMBER_PATTERN = re.compile(r"^[A-Za-z0-9_-]{1,80}$")\n_DOMAIN_PATTERN = re.compile(r"^[a-z0-9.-]+$", re.IGNORECASE)\n''',
          )
          marker = '''def _validate_oracle_source(spec: SourceSpec) -> None:\n'''
          helpers = '''def _require_text_list(spec: SourceSpec, key: str) -> list[str]:\n    value = spec.options.get(key)\n    if not isinstance(value, list):\n        raise ValueError(f"source {spec.source_id!r} option {key!r} must be a list")\n    result = [item.strip() for item in value if isinstance(item, str) and item.strip()]\n    if len(result) != len(value) or not result:\n        raise ValueError(\n            f"source {spec.source_id!r} option {key!r} must contain non-empty text"\n        )\n    return result\n\n\ndef _validate_optional_text_list(spec: SourceSpec, key: str) -> None:\n    if key not in spec.options:\n        return\n    value = spec.options[key]\n    if not isinstance(value, list) or any(\n        not isinstance(item, str) or not item.strip() for item in value\n    ):\n        raise ValueError(\n            f"source {spec.source_id!r} option {key!r} must contain only non-empty text"\n        )\n\n\ndef _validate_public_html(spec: SourceSpec) -> None:\n    base_url = spec.require_text("url")\n    _validate_public_url(base_url, spec.source_id)\n    root_host = (urlsplit(base_url).hostname or "").lower()\n    domains = _require_text_list(spec, "allowed_domains")\n    normalized_domains = {domain.lower() for domain in domains}\n    if root_host not in normalized_domains:\n        raise ValueError(\n            f"source {spec.source_id!r} allowed_domains must include the listing host"\n        )\n    for domain in normalized_domains:\n        if (\n            not _DOMAIN_PATTERN.fullmatch(domain)\n            or domain.startswith(".")\n            or domain.endswith(".")\n            or ".." in domain\n        ):\n            raise ValueError(\n                f"source {spec.source_id!r} has invalid allowed domain {domain!r}"\n            )\n    _require_text_list(spec, "job_link_patterns")\n    _validate_optional_text_list(spec, "anchor_text_patterns")\n    _validate_optional_text_list(spec, "required_anchor_text_patterns")\n    _validate_optional_text_list(spec, "exclude_anchor_text_patterns")\n    template = str(spec.options.get("page_url_template", "")).strip()\n    if template:\n        if "{page}" not in template:\n            raise ValueError(\n                f"source {spec.source_id!r} page_url_template must contain '{{page}}'"\n            )\n        try:\n            rendered = template.format(page=0)\n        except (KeyError, ValueError) as exc:\n            raise ValueError(\n                f"source {spec.source_id!r} has invalid page_url_template"\n            ) from exc\n        _validate_public_url(rendered, spec.source_id, "page_url_template")\n        rendered_host = (urlsplit(rendered).hostname or "").lower()\n        if rendered_host not in normalized_domains:\n            raise ValueError(\n                f"source {spec.source_id!r} page_url_template is outside allowed_domains"\n            )\n    spec.int_option("page_start", 0, minimum=0)\n    spec.int_option("page_step", 1)\n    spec.bool_option("fetch_details", True)\n    spec.bool_option("deny_on_robots_error", True)\n\n\n'''
          replace_once(
              "src/job_intelligence/source_config.py",
              marker,
              helpers + marker,
          )
          replace_once(
              "src/job_intelligence/source_config.py",
              '''    elif spec.source_type == "oracle_hcm":\n        _validate_oracle_source(spec)\n    elif spec.source_type == "smartrecruiters":\n''',
              '''    elif spec.source_type == "oracle_hcm":\n        _validate_oracle_source(spec)\n    elif spec.source_type == "public_html":\n        _validate_public_html(spec)\n    elif spec.source_type == "smartrecruiters":\n''',
          )
          replace_once(
              "src/job_intelligence/source_config.py",
              '''    spec.int_option("max_pages", 100)\n''',
              '''    spec.int_option("max_pages", 100)\n    spec.int_option("max_response_bytes", 15_000_000)\n    spec.int_option("max_redirects", 5, minimum=0)\n''',
          )

          # Dispatch public_html on top of current transactional/evidence runner.
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '''from .collectors import COLLECTORS, collect_sitemap\n''',
              '''from .collectors import COLLECTORS, collect_public_html, collect_sitemap\n''',
          )
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '''            if spec.source_type == "sitemap":\n                result = collect_sitemap(\n                    spec,\n                    client,\n                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n                )\n            else:\n''',
              '''            if spec.source_type == "sitemap":\n                result = collect_sitemap(\n                    spec,\n                    client,\n                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n                )\n            elif spec.source_type == "public_html":\n                result = collect_public_html(\n                    spec,\n                    client,\n                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n                )\n            else:\n''',
          )
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '''            stage = "health"\n            record_source_health(\n                db_path,\n                spec.source_id,\n                spec.name,\n                "pass",\n                records_found=len(result.jobs),\n            )\n''',
              '''            stage = "health"\n            warning_message = " | ".join(result.warnings)\n            source_status = "pass_with_warnings" if warning_message else "pass"\n            record_source_health(\n                db_path,\n                spec.source_id,\n                spec.name,\n                source_status,\n                records_found=len(result.jobs),\n                error_message=warning_message,\n            )\n''',
          )
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '''                    status="pass",\n                    jobs_collected=len(result.jobs),\n                    new_jobs=new_jobs,\n                    updated_jobs=updated_jobs,\n                )\n''',
              '''                    status=source_status,\n                    jobs_collected=len(result.jobs),\n                    new_jobs=new_jobs,\n                    updated_jobs=updated_jobs,\n                    error_message=warning_message,\n                )\n''',
          )

          # A warning run is still a successful source attempt.
          replace_once(
              "src/job_intelligence/database.py",
              '''    success_at = now if status == "pass" else ""\n''',
              '''    successful = status in {"pass", "pass_with_warnings"}\n    success_at = now if successful else ""\n''',
          )
          replace_once(
              "src/job_intelligence/database.py",
              '''                    WHEN excluded.status='pass' THEN excluded.last_success_at\n''',
              '''                    WHEN excluded.status IN ('pass', 'pass_with_warnings')\n                    THEN excluded.last_success_at\n''',
          )

          # Runtime dependency and version.
          replace_once(
              "pyproject.toml",
              '''version = "0.2.0"\n''',
              '''version = "0.3.0"\n''',
          )
          replace_once(
              "pyproject.toml",
              '''dependencies = [\n  "defusedxml>=0.7.1",\n''',
              '''dependencies = [\n  "beautifulsoup4>=4.12.3",\n  "defusedxml>=0.7.1",\n''',
          )
          requirements = Path("requirements.txt")
          text = requirements.read_text(encoding="utf-8")
          if "beautifulsoup4" not in text:
              requirements.write_text(
                  "beautifulsoup4>=4.12.3\n" + text,
                  encoding="utf-8",
              )

          Path("tests/test_public_html_review_fixes.py").write_text(
              '''from pathlib import Path\n\nfrom job_intelligence.collectors.public_html import _RobotsCache\nfrom job_intelligence.database import connect, record_source_health\n\n\nclass FailingRobotsClient:\n    user_agent = "test-agent"\n\n    def __init__(self) -> None:\n        self.calls = 0\n\n    def get(self, *_args, **_kwargs):\n        self.calls += 1\n        raise OSError("robots unavailable")\n\n\ndef test_robots_error_is_cached_for_origin() -> None:\n    client = FailingRobotsClient()\n    cache = _RobotsCache(client, enabled=True, deny_on_error=True)\n\n    assert cache.can_fetch("https://example.com/jobs/1") is False\n    assert cache.can_fetch("https://example.com/jobs/2") is False\n    assert client.calls == 1\n\n\ndef test_pass_with_warnings_updates_success_timestamp(tmp_path: Path) -> None:\n    db_path = tmp_path / "jobs.db"\n    record_source_health(\n        db_path,\n        "source",\n        "Source",\n        "pass_with_warnings",\n        records_found=1,\n        error_message="detail fallback",\n    )\n\n    with connect(db_path) as connection:\n        row = connection.execute(\n            "SELECT status, last_success_at, error_message FROM source_health"\n        ).fetchone()\n    assert row["status"] == "pass_with_warnings"\n    assert row["last_success_at"]\n    assert row["error_message"] == "detail fallback"\n''',
              encoding="utf-8",
          )

          Path("docs/PUBLIC_HTML_COLLECTOR.md").write_text(
              '''# Public HTML Collector\n\nThe `public_html` collector is available for official career pages that do not have a verified supported API. All production HTML sources remain disabled until a source-specific live proof passes.\n\nControls include exact domain and link allowlists, bounded pagination and item counts, robots checks using the crawler identity, role/location anchor filters, schema.org parsing, constrained HTML fallback, local raw evidence with SHA-256 verification, and `pass_with_warnings` when a safe listing-only fallback is retained.\n\nThe verified production sources remain the McDermott and Wood Oracle connectors in `config/sources.yaml`. Disabled examples belong in `config/sources.example.yaml`; CI uses `config/sources.ci.yaml` and performs no live collection.\n''',
              encoding="utf-8",
          )

          Path(".github/workflows/integrate-employer-registry.yml").unlink()
          PY

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Full verification
        shell: bash
        run: |
          git diff --check
          ruff check src tests
          pytest -q
          job-intel validate-sources --sources config/sources.yaml
          job-intel validate-sources --sources config/sources.example.yaml
          job-intel validate-sources --sources config/sources.ci.yaml
          rm -rf tmp
          job-intel --db tmp/jobs.db collect \
            --sources config/sources.ci.yaml \
            --evidence-dir tmp/raw \
            --no-export
          job-intel --db tmp/jobs.db export --output tmp/Piping_E3D_Jobs.xlsx
          job-intel --db tmp/jobs.db verify --output tmp/Piping_E3D_Jobs.xlsx
          rm -rf tmp

      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Integrate verified employer registry and disabled HTML collector"
          git push origin HEAD:agent/integrate-employer-registry
