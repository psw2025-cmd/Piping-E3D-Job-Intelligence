name: pr9-pytest-diagnostic

on:
  push:
    branches:
      - agent/integrate-employer-registry

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-employer-registry
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Capture pytest findings
        shell: bash
        run: |
          set +e
          pytest -q > pr9_pytest_diagnostic.txt 2>&1
          rc=$?
          echo "PYTEST_RC=$rc" >> pr9_pytest_diagnostic.txt
          cat pr9_pytest_diagnostic.txt
          rm .github/workflows/pr9-pytest-diagnostic.yml

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr9_pytest_diagnostic.txt .github/workflows/pr9-pytest-diagnostic.yml
          git commit -m "WIP: capture PR #9 pytest diagnostics"
          git push origin HEAD:agent/integrate-employer-registry
