name: public-contact-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -q --upgrade pip && pip install -q -e ".[dev]"
      - name: Capture Ruff report
        run: |
          mkdir -p tmp/diagnostics
          ruff check src tests scripts --output-format=concise > tmp/diagnostics/ruff.txt 2>&1 || true
      - name: Capture focused pytest report
        run: |
          pytest tests/test_public_contacts.py -q > tmp/diagnostics/pytest.txt 2>&1 || true
      - name: Publish diagnostics comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ruff = fs.readFileSync('tmp/diagnostics/ruff.txt', 'utf8').slice(0, 12000);
            const pytest = fs.readFileSync('tmp/diagnostics/pytest.txt', 'utf8').slice(0, 12000);
            const body = `<!-- public-contact-diagnostics -->\n## Public contact diagnostics\n\n### Ruff\n\n\`\`\`text\n${ruff || 'PASS'}\n\`\`\`\n\n### Pytest\n\n\`\`\`text\n${pytest || 'No output'}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: public-contact-diagnostics
          path: tmp/diagnostics/
          if-no-files-found: error
          retention-days: 2
