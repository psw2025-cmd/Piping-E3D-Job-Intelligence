name: global-48h-piping-scan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-48h-piping-scan.yml"
      - "scripts/build_48h_urgent_report.py"
      - "scripts/run_cloud_daily.py"
      - "config/**"
      - "src/job_intelligence/**"
      - "tests/test_48h_urgent_report.py"

permissions:
  contents: write

concurrency:
  group: global-48h-piping-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test 48-hour classification
        run: pytest -q tests/test_48h_urgent_report.py

      - name: Collect permitted official sources
        run: python scripts/run_cloud_daily.py --output output/global-48h

      - name: Build strict recent and urgent report
        run: |
          python scripts/build_48h_urgent_report.py \
            --db output/global-48h/jobs.db \
            --output-md docs/LATEST_48H_GLOBAL_PIPING_SCAN.md \
            --output-json docs/LATEST_48H_GLOBAL_PIPING_SCAN.json \
            --hours 48 \
            --timezone Asia/Kolkata

      - name: Publish report in workflow summary
        run: cat docs/LATEST_48H_GLOBAL_PIPING_SCAN.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-48h-piping-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/LATEST_48H_GLOBAL_PIPING_SCAN.md
            docs/LATEST_48H_GLOBAL_PIPING_SCAN.json
            output/global-48h/SUMMARY.md
            output/global-48h/status.json
            output/global-48h/run.log
            output/global-48h/Piping_E3D_Daily_Bundle.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Commit latest evidence-backed report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LATEST_48H_GLOBAL_PIPING_SCAN.md docs/LATEST_48H_GLOBAL_PIPING_SCAN.json
          if git diff --cached --quiet; then
            echo "No report change to commit."
            exit 0
          fi
          git commit -m "report: refresh global 48-hour piping scan [skip ci]"
          git push origin HEAD:main
