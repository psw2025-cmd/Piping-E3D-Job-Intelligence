          )

          Path("tests/test_schema_org_salary.py").write_text(
              '''from job_intelligence.collectors.schema_org import _salary\n\n\ndef test_max_only_salary_does_not_render_none() -> None:\n    result = _salary(\n        {\n            "currency": "USD",\n            "value": {"maxValue": 150000, "unitText": "YEAR"},\n        }\n    )\n    assert result == "USD 150000 per YEAR"\n    assert "None" not in result\n''',
              encoding="utf-8",
          )

          Path("tests/test_windows_runner.py").write_text(
              '''from pathlib import Path\n\n\ndef test_failed_collect_stops_before_verify() -> None:\n    script = Path("scripts/run_daily.ps1").read_text(encoding="utf-8")\n    collect_check = script.index("if ($collectExit -eq 2)")\n    verify_command = script.index(" -m job_intelligence.cli --db $db verify")\n    assert collect_check < verify_command\n    assert "possibly stale workbook" in script\n\n\ndef test_partial_collect_still_runs_verify() -> None:\n    script = Path("scripts/run_daily.ps1").read_text(encoding="utf-8")\n    verify_command = script.index(" -m job_intelligence.cli --db $db verify")\n    partial_check = script.index("if ($collectExit -eq 1)")\n    assert verify_command < partial_check\n''',
              encoding="utf-8",
          )

          Path(".github/workflows/agent-fix-phase2-review.yml").unlink()
          PY

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Verify all fixes
        shell: bash
        run: |
          git diff --check
          ruff check src tests
          pytest -q
          rm -rf tmp
          job-intel validate-sources --sources config/sources.yaml
          job-intel --db tmp/jobs.db init-db
          job-intel --db tmp/jobs.db collect \
            --sources config/sources.yaml \
            --evidence-dir tmp/raw \
            --no-export
          job-intel --db tmp/jobs.db export \
            --output tmp/Piping_E3D_Jobs.xlsx
          job-intel --db tmp/jobs.db verify \
            --output tmp/Piping_E3D_Jobs.xlsx
          rm -rf tmp

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix Phase 2 high-effort review findings"
          git push origin HEAD:agent/fix-phase2-high-effort-review
