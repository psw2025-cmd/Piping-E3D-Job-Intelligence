name: agent-fix-phase2-high-effort-review

on:
  push:
    branches:
      - agent/fix-phase2-high-effort-review

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-phase2-high-effort-review
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match in {path}, found {count}: {old[:100]!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/job_intelligence/database.py",
              '''def upsert_job(db_path: str | Path, job: JobRecord) -> bool:\n    init_database(db_path)\n    if not job.title.strip() or not job.company.strip():\n        raise ValueError("title and company are required")\n\n    identity_fingerprint = build_identity_fingerprint(job)\n    canonical_url = canonicalize_url(job.apply_url or job.source_url)\n    columns = ", ".join(JOB_COLUMNS)\n    placeholders = ", ".join(f":{column}" for column in JOB_COLUMNS)\n    string_updates = ",\\n                ".join(\n        f"{column}=COALESCE(NULLIF(excluded.{column}, ''), jobs.{column})"\n        for column in _STRING_REFRESH_COLUMNS\n    )\n\n    with connect(db_path) as connection:\n        existing_key = _find_existing_job_key(\n            connection,\n            job.job_key,\n            identity_fingerprint,\n            canonical_url,\n        )\n        job.job_key = existing_key or _allocate_job_key(\n            connection,\n            job,\n            canonical_url,\n        )\n        existed = existing_key is not None\n        if not existed:\n            existed = (\n                connection.execute(\n                    "SELECT 1 FROM jobs WHERE job_key = ?",\n                    (job.job_key,),\n                ).fetchone()\n                is not None\n            )\n        values = _job_values(job, identity_fingerprint, canonical_url)\n        connection.execute(\n            f"""\n            INSERT INTO jobs ({columns}) VALUES ({placeholders})\n            ON CONFLICT(job_key) DO UPDATE SET\n                identity_fingerprint=excluded.identity_fingerprint,\n                canonical_url=COALESCE(\n                    NULLIF(excluded.canonical_url, ''), jobs.canonical_url\n                ),\n                {string_updates},\n                last_seen_at=excluded.last_seen_at,\n                recruiter_name=COALESCE(\n                    NULLIF(excluded.recruiter_name, ''), jobs.recruiter_name\n                ),\n                recruiter_email=COALESCE(\n                    NULLIF(excluded.recruiter_email, ''), jobs.recruiter_email\n                ),\n                contact_confidence=COALESCE(\n                    NULLIF(excluded.contact_confidence, ''), jobs.contact_confidence\n                ),\n                match_score=CASE\n                    WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                    THEN excluded.match_score ELSE jobs.match_score END,\n                match_reasons=CASE\n                    WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                    THEN excluded.match_reasons ELSE jobs.match_reasons END,\n                gaps=CASE\n                    WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                    THEN excluded.gaps ELSE jobs.gaps END,\n                priority=CASE\n                    WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                    THEN excluded.priority ELSE jobs.priority END,\n                application_status=jobs.application_status\n            """,\n            values,\n        )\n        _register_identity_aliases(\n            connection,\n            job.job_key,\n            identity_fingerprint,\n            canonical_url,\n            job.found_at,\n        )\n    return not existed\n\n\ndef upsert_jobs(db_path: str | Path, jobs: Iterable[JobRecord]) -> tuple[int, int]:\n    new_count = 0\n    updated_count = 0\n    for job in jobs:\n        if upsert_job(db_path, job):\n            new_count += 1\n        else:\n            updated_count += 1\n    return new_count, updated_count\n''',
              '''def _upsert_job(connection: sqlite3.Connection, job: JobRecord) -> bool:\n    if not job.title.strip() or not job.company.strip():\n        raise ValueError("title and company are required")\n\n    identity_fingerprint = build_identity_fingerprint(job)\n    canonical_url = canonicalize_url(job.apply_url or job.source_url)\n    columns = ", ".join(JOB_COLUMNS)\n    placeholders = ", ".join(f":{column}" for column in JOB_COLUMNS)\n    string_updates = ",\\n                ".join(\n        f"{column}=COALESCE(NULLIF(excluded.{column}, ''), jobs.{column})"\n        for column in _STRING_REFRESH_COLUMNS\n    )\n\n    existing_key = _find_existing_job_key(\n        connection,\n        job.job_key,\n        identity_fingerprint,\n        canonical_url,\n    )\n    job.job_key = existing_key or _allocate_job_key(\n        connection,\n        job,\n        canonical_url,\n    )\n    existed = existing_key is not None\n    if not existed:\n        existed = (\n            connection.execute(\n                "SELECT 1 FROM jobs WHERE job_key = ?",\n                (job.job_key,),\n            ).fetchone()\n            is not None\n        )\n    values = _job_values(job, identity_fingerprint, canonical_url)\n    connection.execute(\n        f"""\n        INSERT INTO jobs ({columns}) VALUES ({placeholders})\n        ON CONFLICT(job_key) DO UPDATE SET\n            identity_fingerprint=excluded.identity_fingerprint,\n            canonical_url=COALESCE(\n                NULLIF(excluded.canonical_url, ''), jobs.canonical_url\n            ),\n            {string_updates},\n            last_seen_at=excluded.last_seen_at,\n            recruiter_name=COALESCE(\n                NULLIF(excluded.recruiter_name, ''), jobs.recruiter_name\n            ),\n            recruiter_email=COALESCE(\n                NULLIF(excluded.recruiter_email, ''), jobs.recruiter_email\n            ),\n            contact_confidence=COALESCE(\n                NULLIF(excluded.contact_confidence, ''), jobs.contact_confidence\n            ),\n            match_score=CASE\n                WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                THEN excluded.match_score ELSE jobs.match_score END,\n            match_reasons=CASE\n                WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                THEN excluded.match_reasons ELSE jobs.match_reasons END,\n            gaps=CASE\n                WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                THEN excluded.gaps ELSE jobs.gaps END,\n            priority=CASE\n                WHEN excluded.match_reasons <> '' OR excluded.gaps <> ''\n                THEN excluded.priority ELSE jobs.priority END,\n            application_status=jobs.application_status\n        """,\n        values,\n    )\n    _register_identity_aliases(\n        connection,\n        job.job_key,\n        identity_fingerprint,\n        canonical_url,\n        job.found_at,\n    )\n    return not existed\n\n\ndef upsert_job(db_path: str | Path, job: JobRecord) -> bool:\n    init_database(db_path)\n    with connect(db_path) as connection:\n        return _upsert_job(connection, job)\n\n\ndef upsert_jobs(db_path: str | Path, jobs: Iterable[JobRecord]) -> tuple[int, int]:\n    init_database(db_path)\n    new_count = 0\n    updated_count = 0\n    with connect(db_path) as connection:\n        for job in jobs:\n            if _upsert_job(connection, job):\n                new_count += 1\n            else:\n                updated_count += 1\n    return new_count, updated_count\n''',
          )

          replace_once(
              "src/job_intelligence/collection_runner.py",
              '''def _prepare_jobs(spec: SourceSpec, jobs: list[JobRecord], config_dir: Path) -> None:\n''',
              '''def _delete_evidence(\n    db_path: str | Path,\n    evidence_root: str | Path,\n    run_id: str,\n    source_id: str,\n) -> None:\n    destination = Path(evidence_root) / source_id / run_id\n    shutil.rmtree(destination, ignore_errors=True)\n    with connect(db_path) as connection:\n        connection.execute(\n            "DELETE FROM source_evidence WHERE run_id=? AND source_id=?",\n            (run_id, source_id),\n        )\n\n\ndef _prepare_jobs(spec: SourceSpec, jobs: list[JobRecord], config_dir: Path) -> None:\n''',
          )
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '''        try:\n            client = factory(spec)\n            if spec.source_type == "sitemap":\n                result = collect_sitemap(\n                    spec,\n                    client,\n                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n                )\n            else:\n                collector = COLLECTORS[spec.source_type]\n                result = collector(spec, client)\n            _prepare_jobs(spec, result.jobs, config_path.parent)\n            if source_config.policy["retain_source_evidence"]:\n                _save_evidence(\n                    db_path,\n                    evidence_root,\n                    run_id,\n                    spec.source_id,\n                    result.evidence,\n                )\n            new_jobs, updated_jobs = upsert_jobs(db_path, result.jobs)\n            record_source_health(\n                db_path,\n                spec.source_id,\n                spec.name,\n                "pass",\n                records_found=len(result.jobs),\n            )\n            summary.sources_passed += 1\n            summary.jobs_collected += len(result.jobs)\n            summary.new_jobs += new_jobs\n            summary.updated_jobs += updated_jobs\n            summary.source_results.append(\n                SourceRunResult(\n                    source_id=spec.source_id,\n                    status="pass",\n                    jobs_collected=len(result.jobs),\n                    new_jobs=new_jobs,\n                    updated_jobs=updated_jobs,\n                )\n            )\n        except Exception as exc:\n            message = f"{type(exc).__name__}: {exc}"\n            errors.append(f"{spec.source_id}: {message}")\n            record_source_health(\n                db_path,\n                spec.source_id,\n                spec.name,\n                "fail",\n                error_message=message,\n            )\n            summary.sources_failed += 1\n            summary.source_results.append(\n                SourceRunResult(\n                    source_id=spec.source_id,\n                    status="fail",\n                    jobs_collected=0,\n                    new_jobs=0,\n                    updated_jobs=0,\n                    error_message=message,\n                )\n            )\n''',
              '''        result = None\n        evidence_saved = False\n        stage = "collect"\n        try:\n            client = factory(spec)\n            if spec.source_type == "sitemap":\n                result = collect_sitemap(\n                    spec,\n                    client,\n                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n                )\n            else:\n                collector = COLLECTORS[spec.source_type]\n                result = collector(spec, client)\n            if source_config.policy["retain_source_evidence"]:\n                _save_evidence(\n                    db_path,\n                    evidence_root,\n                    run_id,\n                    spec.source_id,\n                    result.evidence,\n                )\n                evidence_saved = True\n            stage = "score"\n            _prepare_jobs(spec, result.jobs, config_path.parent)\n            stage = "upsert"\n            new_jobs, updated_jobs = upsert_jobs(db_path, result.jobs)\n            stage = "health"\n            record_source_health(\n                db_path,\n                spec.source_id,\n                spec.name,\n                "pass",\n                records_found=len(result.jobs),\n            )\n            summary.sources_passed += 1\n            summary.jobs_collected += len(result.jobs)\n            summary.new_jobs += new_jobs\n            summary.updated_jobs += updated_jobs\n            summary.source_results.append(\n                SourceRunResult(\n                    source_id=spec.source_id,\n                    status="pass",\n                    jobs_collected=len(result.jobs),\n                    new_jobs=new_jobs,\n                    updated_jobs=updated_jobs,\n                )\n            )\n        except Exception as exc:\n            message = f"{type(exc).__name__}: {exc}"\n            if evidence_saved and stage == "upsert":\n                try:\n                    _delete_evidence(\n                        db_path,\n                        evidence_root,\n                        run_id,\n                        spec.source_id,\n                    )\n                except Exception as cleanup_exc:\n                    message += (\n                        " | evidence cleanup failed: "\n                        f"{type(cleanup_exc).__name__}: {cleanup_exc}"\n                    )\n            fetched_count = len(result.jobs) if result is not None else 0\n            errors.append(f"{spec.source_id}: {message}")\n            record_source_health(\n                db_path,\n                spec.source_id,\n                spec.name,\n                "fail",\n                records_found=fetched_count,\n                error_message=message,\n            )\n            summary.sources_failed += 1\n            summary.source_results.append(\n                SourceRunResult(\n                    source_id=spec.source_id,\n                    status="fail",\n                    jobs_collected=fetched_count,\n                    new_jobs=0,\n                    updated_jobs=0,\n                    error_message=message,\n                )\n            )\n''',
          )

