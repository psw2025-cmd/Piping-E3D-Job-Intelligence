          replace_once(
              "scripts/run_daily.ps1",
              '''$collectExit = $LASTEXITCODE\n\n& $Python -m job_intelligence.cli --db $db verify --output $xlsx *>&1 |\n    Tee-Object -FilePath $proof -Append\n$verifyExit = $LASTEXITCODE\nif ($verifyExit -ne 0) {\n    throw "Verification failed. See $proof"\n}\n\nif ($collectExit -eq 2) {\n    throw "Collection failed after verification. Review Source_Health and $proof"\n}\nif ($collectExit -eq 1) {\n    throw "Collection was partial but verification completed. Review Source_Health and $proof"\n}\nif ($collectExit -ne 0) {\n    throw "Collection returned unexpected exit code $collectExit. See $proof"\n}\n''',
              '''$collectExit = $LASTEXITCODE\nif ($collectExit -eq 2) {\n    throw "Collection failed; verification was not run against a possibly stale workbook. Review Source_Health and $proof"\n}\nif ($collectExit -notin @(0, 1)) {\n    throw "Collection returned unexpected exit code $collectExit. See $proof"\n}\n\n& $Python -m job_intelligence.cli --db $db verify --output $xlsx *>&1 |\n    Tee-Object -FilePath $proof -Append\n$verifyExit = $LASTEXITCODE\nif ($verifyExit -ne 0) {\n    throw "Verification failed. See $proof"\n}\n\nif ($collectExit -eq 1) {\n    throw "Collection was partial but verification completed. Review Source_Health and $proof"\n}\n''',
          )

          replace_once(
              "tests/test_database_integrity.py",
              '''from pathlib import Path\n\nfrom job_intelligence.database import connect, fetch_jobs, init_database, upsert_job\n''',
              '''from pathlib import Path\n\nimport pytest\n\nfrom job_intelligence.database import (\n    connect,\n    fetch_jobs,\n    init_database,\n    upsert_job,\n    upsert_jobs,\n)\n''',
          )
          database_tests = Path("tests/test_database_integrity.py")
          database_tests.write_text(
              database_tests.read_text(encoding="utf-8")
              + '''\n\ndef test_batch_upsert_rolls_back_all_jobs_on_failure(tmp_path: Path) -> None:\n    db_path = tmp_path / "jobs.db"\n    valid = JobRecord(title="Piping Engineer", company="Example EPC")\n    invalid = JobRecord(title="", company="Example EPC")\n\n    with pytest.raises(ValueError, match="title and company are required"):\n        upsert_jobs(db_path, [valid, invalid])\n\n    assert fetch_jobs(db_path) == []\n''',
              encoding="utf-8",
          )

          collection_tests = Path("tests/test_collection_runner_integrity.py")
          replace_once(
              str(collection_tests),
              '''from job_intelligence.database import fetch_jobs\n''',
              '''from job_intelligence.database import connect, fetch_jobs\n''',
          )
          collection_tests.write_text(
              collection_tests.read_text(encoding="utf-8")
              + '''\n\ndef _greenhouse_client_factory(url: str, payload: bytes):\n    def factory(_source: SourceSpec) -> OneResponseClient:\n        return OneResponseClient(\n            url,\n            FetchedResponse(\n                url=url,\n                status_code=200,\n                headers={"content-type": "application/json"},\n                content=payload,\n            ),\n        )\n\n    return factory\n\n\ndef test_scoring_failure_retains_fetched_evidence(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    config = tmp_path / "sources.yaml"\n    config.write_text(source_yaml(), encoding="utf-8")\n    url = "https://boards-api.greenhouse.io/v1/boards/example/jobs"\n    payload = (\n        b'{"jobs":[{"title":"Piping Engineer",'\n        b'"absolute_url":"https://example.com/jobs/score"}]}'\n    )\n\n    def fail_scoring(*_args, **_kwargs) -> None:\n        raise RuntimeError("simulated scoring failure")\n\n    monkeypatch.setattr(collection_runner, "_prepare_jobs", fail_scoring)\n    db_path = tmp_path / "jobs.db"\n    summary = collect_sources(\n        db_path,\n        config,\n        tmp_path / "evidence",\n        client_factory=_greenhouse_client_factory(url, payload),\n    )\n\n    assert summary.status == "fail"\n    assert summary.source_results[0].jobs_collected == 1\n    assert fetch_jobs(db_path) == []\n    with connect(db_path) as connection:\n        evidence = connection.execute(\n            "SELECT file_path FROM source_evidence"\n        ).fetchone()\n        health = connection.execute(\n            "SELECT status, records_found FROM source_health"\n        ).fetchone()\n    assert evidence is not None\n    assert Path(evidence["file_path"]).exists()\n    assert tuple(health) == ("fail", 1)\n\n\ndef test_upsert_failure_removes_evidence_and_jobs(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    config = tmp_path / "sources.yaml"\n    config.write_text(source_yaml(), encoding="utf-8")\n    url = "https://boards-api.greenhouse.io/v1/boards/example/jobs"\n    payload = (\n        b'{"jobs":[{"title":"Piping Engineer",'\n        b'"absolute_url":"https://example.com/jobs/upsert"}]}'\n    )\n\n    def fail_upsert(*_args, **_kwargs):\n        raise RuntimeError("simulated upsert failure")\n\n    monkeypatch.setattr(collection_runner, "upsert_jobs", fail_upsert)\n    db_path = tmp_path / "jobs.db"\n    evidence_root = tmp_path / "evidence"\n    summary = collect_sources(\n        db_path,\n        config,\n        evidence_root,\n        client_factory=_greenhouse_client_factory(url, payload),\n    )\n\n    assert summary.status == "fail"\n    assert fetch_jobs(db_path) == []\n    with connect(db_path) as connection:\n        count = connection.execute("SELECT COUNT(*) FROM source_evidence").fetchone()[0]\n    assert count == 0\n    run_directory = evidence_root / "target_greenhouse" / summary.run_id\n    assert run_directory.exists() is False\n''',
