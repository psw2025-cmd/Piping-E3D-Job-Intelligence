name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pytest
        run: |
          mkdir -p tmp
          pytest -q --junitxml=tmp/pytest.xml

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/pytest.xml
          if-no-files-found: warn
          retention-days: 7

      - name: CLI smoke test
        run: |
          job-intel validate-sources --sources config/sources.yaml
          job-intel validate-sources --sources config/sources.ci.yaml
          job-intel --db tmp/jobs.db init-db
          job-intel --db tmp/jobs.db collect \
            --sources config/sources.ci.yaml \
            --evidence-dir tmp/raw \
            --no-export
          mkdir -p tmp/private-input
          cat > tmp/private-input/vacancy.txt <<'EOF'
          Job Title: Senior E3D Piping Designer
          Company: Example EPC
          Location: Mumbai
          AVEVA E3D refinery piping layout role.
          EOF
          job-intel --db tmp/jobs.db import-file \
            --file tmp/private-input/vacancy.txt \
            --title "Senior E3D Piping Designer" \
            --company "Example EPC" \
            --location "Mumbai" \
            --evidence-dir tmp/private-evidence \
            --no-export
          job-intel --db tmp/jobs.db export \
            --output tmp/Piping_E3D_Jobs.xlsx
          job-intel --db tmp/jobs.db verify \
            --output tmp/Piping_E3D_Jobs.xlsx

      - name: Cloud daily runner offline proof
        shell: bash
        run: |
          python scripts/run_cloud_daily.py \
            --sources config/sources.ci.yaml \
            --output tmp/cloud-daily \
            --allow-no-sources
          test -f tmp/cloud-daily/SUMMARY.md
          test -f tmp/cloud-daily/status.json
          test -f tmp/cloud-daily/run.log
          test -f tmp/cloud-daily/Piping_E3D_Jobs.xlsx
          test -f tmp/cloud-daily/jobs.db
          test -f tmp/cloud-daily/Piping_E3D_Daily_Bundle.zip
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("tmp/cloud-daily/status.json").read_text(encoding="utf-8")
          )
          assert status["exit_code"] == 0
          assert status["verified"] is True
          assert status["collection_status"] == "no_sources"
          PY
