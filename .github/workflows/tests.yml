name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: CLI smoke test
        run: |
          job-intel validate-sources --sources config/sources.yaml
          job-intel --db tmp/jobs.db init-db
          job-intel --db tmp/jobs.db collect \
            --sources config/sources.yaml \
            --evidence-dir tmp/raw \
            --no-export
          job-intel --db tmp/jobs.db export \
            --output tmp/Piping_E3D_Jobs.xlsx
          job-intel --db tmp/jobs.db verify \
            --output tmp/Piping_E3D_Jobs.xlsx
