name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pytest
        run: pytest -q

      - name: CLI smoke test
        run: |
          job-intel validate-sources --sources config/sources.yaml
          job-intel validate-sources --sources config/sources.ci.yaml
          job-intel --db tmp/jobs.db init-db
          job-intel --db tmp/jobs.db collect \
            --sources config/sources.ci.yaml \
            --evidence-dir tmp/raw \
            --no-export
          mkdir -p tmp/private-input
          cat > tmp/private-input/vacancy.txt <<'EOF'
          Job Title: Senior E3D Piping Designer
          Company: Example EPC
          Location: Mumbai
          AVEVA E3D refinery piping layout role.
          EOF
          job-intel --db tmp/jobs.db import-file \
            --file tmp/private-input/vacancy.txt \
            --title "Senior E3D Piping Designer" \
            --company "Example EPC" \
            --location "Mumbai" \
            --evidence-dir tmp/private-evidence \
            --no-export
          job-intel --db tmp/jobs.db export \
            --output tmp/Piping_E3D_Jobs.xlsx
          job-intel --db tmp/jobs.db verify \
            --output tmp/Piping_E3D_Jobs.xlsx

      - name: Cloud daily runner and coverage bundle offline proof
        shell: bash
        run: |
          python scripts/run_cloud_daily.py \
            --sources config/sources.ci.yaml \
            --output tmp/cloud-daily \
            --allow-no-sources
          python scripts/append_daily_coverage.py \
            --output tmp/cloud-daily
          test -f tmp/cloud-daily/SUMMARY.md
          test -f tmp/cloud-daily/status.json
          test -f tmp/cloud-daily/run.log
          test -f tmp/cloud-daily/Piping_E3D_Jobs.xlsx
          test -f tmp/cloud-daily/jobs.db
          test -f tmp/cloud-daily/Piping_E3D_Daily_Bundle.zip
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          output = Path("tmp/cloud-daily")
          status = json.loads(
              (output / "status.json").read_text(encoding="utf-8")
          )
          assert status["exit_code"] == 0
          assert status["verified"] is True
          assert status["coverage_verified"] is True
          assert status["collection_status"] == "no_sources"
          assert status["coverage_company_count"] >= 31
          with zipfile.ZipFile(output / "Piping_E3D_Daily_Bundle.zip") as archive:
              names = set(archive.namelist())
              assert any(name.endswith("Piping_E3D_Jobs.xlsx") for name in names)
              assert any(name.endswith("status.json") for name in names)
              assert any(name.endswith("SUMMARY.md") for name in names)
          PY
