name: prove-daily-live

on:
  push:
    branches:
      - agent/daily-live-job-intelligence
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: agent/daily-live-job-intelligence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run live daily collection
        id: daily
        continue-on-error: true
        run: python scripts/run_cloud_daily.py --output output/daily

      - name: Publish proof summary
        if: always()
        shell: bash
        run: cat output/daily/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live proof artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: piping-e3d-live-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/daily/SUMMARY.md
            output/daily/status.json
            output/daily/run.log
            output/daily/Piping_E3D_Daily_Bundle.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Enforce live proof success
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("output/daily/status.json").read_text(encoding="utf-8")
          )
          if int(status.get("exit_code", 2)) != 0:
              raise SystemExit(status.get("error") or status.get("collection_status"))
          if not status.get("verified"):
              raise SystemExit("Live output was not verified")
          print("PASS: controlled live daily proof")
          PY

      - name: Remove temporary proof workflow
        shell: bash
        run: |
          rm .github/workflows/prove-daily-live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/prove-daily-live.yml
          git commit -m "Remove temporary daily live proof workflow"
          git push origin HEAD:agent/daily-live-job-intelligence
