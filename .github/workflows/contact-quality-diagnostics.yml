name: contact-quality-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -q --upgrade pip && pip install -q -e ".[dev]"
      - name: Capture diagnostics
        run: |
          mkdir -p tmp/diagnostics
          ruff check src tests scripts --output-format=concise > tmp/diagnostics/ruff.txt 2>&1 || true
          pytest tests/test_public_contacts.py tests/test_contact_quality.py -q > tmp/diagnostics/pytest.txt 2>&1 || true
      - name: Publish diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = `<!-- contact-quality-diagnostics -->
            ## Contact quality diagnostics

            ### Ruff
            \`\`\`text
            ${fs.readFileSync('tmp/diagnostics/ruff.txt', 'utf8').slice(0, 20000)}
            \`\`\`

            ### Pytest
            \`\`\`text
            ${fs.readFileSync('tmp/diagnostics/pytest.txt', 'utf8').slice(0, 20000)}
            \`\`\`
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
