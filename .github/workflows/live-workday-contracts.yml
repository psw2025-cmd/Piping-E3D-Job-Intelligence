name: live-workday-contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/sources.yaml"
      - "config/employer_registry.yaml"
      - "src/job_intelligence/collectors/http_client.py"
      - "src/job_intelligence/collectors/workday.py"
      - "src/job_intelligence/source_config.py"
      - "scripts/verify_live_workday_sources.py"
      - "tests/test_workday.py"
      - ".github/workflows/live-workday-contracts.yml"

permissions:
  contents: read

concurrency:
  group: live-workday-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-workday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts/verify_live_workday_sources.py

      - name: Unit tests
        run: pytest -q tests/test_workday.py tests/test_http_client_post_security.py

      - name: Live official Workday contract proof
        run: python scripts/verify_live_workday_sources.py
