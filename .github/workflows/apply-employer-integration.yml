name: apply-employer-integration

on:
  push:
    branches:
      - agent/integrate-employer-registry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-employer-registry
          fetch-depth: 0

      - name: Apply current-main integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one match in {path}, found {count}: {old[:100]!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/job_intelligence/collectors/public_html.py",
              "        self.cache: dict[str, RobotFileParser | None] = {}\n",
              "        self.cache: dict[str, RobotFileParser | None] = {}\n"
              "        self.denied_origins: set[str] = set()\n",
          )
          replace_once(
              "src/job_intelligence/collectors/public_html.py",
              "        if origin not in self.cache:\n"
              "            robots_url = f\"{origin}/robots.txt\"\n",
              "        if origin in self.denied_origins:\n"
              "            return False\n"
              "        if origin not in self.cache:\n"
              "            robots_url = f\"{origin}/robots.txt\"\n",
          )
          replace_once(
              "src/job_intelligence/collectors/public_html.py",
              "            except Exception:\n"
              "                if self.deny_on_error:\n"
              "                    return False\n"
              "                self.cache[origin] = None\n",
              "            except Exception:\n"
              "                if self.deny_on_error:\n"
              "                    self.denied_origins.add(origin)\n"
              "                    return False\n"
              "                self.cache[origin] = None\n",
          )

          replace_once(
              "src/job_intelligence/collectors/common.py",
              "class CollectionResult:\n"
              "    jobs: list[JobRecord] = field(default_factory=list)\n"
              "    evidence: list[EvidenceArtifact] = field(default_factory=list)\n",
              "class CollectionResult:\n"
              "    jobs: list[JobRecord] = field(default_factory=list)\n"
              "    evidence: list[EvidenceArtifact] = field(default_factory=list)\n"
              "    warnings: list[str] = field(default_factory=list)\n",
          )

          replace_once(
              "src/job_intelligence/collectors/__init__.py",
              "from .oracle_hcm import collect_oracle_hcm\nfrom .rss import collect_rss\n",
              "from .oracle_hcm import collect_oracle_hcm\n"
              "from .public_html import collect_public_html\n"
              "from .rss import collect_rss\n",
          )
          replace_once(
              "src/job_intelligence/collectors/__init__.py",
              '    "Collector",\n    "collect_sitemap",\n',
              '    "Collector",\n    "collect_public_html",\n    "collect_sitemap",\n',
          )

          replace_once(
              "src/job_intelligence/source_config.py",
              '    "oracle_hcm",\n    "smartrecruiters",\n',
              '    "oracle_hcm",\n    "public_html",\n    "smartrecruiters",\n',
          )
          replace_once(
              "src/job_intelligence/source_config.py",
              '_SITE_NUMBER_PATTERN = re.compile(r"^[A-Za-z0-9_-]{1,80}$")\n',
              '_SITE_NUMBER_PATTERN = re.compile(r"^[A-Za-z0-9_-]{1,80}$")\n'
              '_DOMAIN_PATTERN = re.compile(r"^[a-z0-9.-]+$", re.IGNORECASE)\n',
          )
          marker = "def _validate_oracle_source(spec: SourceSpec) -> None:\n"
          helpers = '''def _require_text_list(spec: SourceSpec, key: str) -> list[str]:
              value = spec.options.get(key)
              if not isinstance(value, list):
                  raise ValueError(
                      f"source {spec.source_id!r} option {key!r} must be a list"
                  )
              result = [
                  item.strip()
                  for item in value
                  if isinstance(item, str) and item.strip()
              ]
              if len(result) != len(value) or not result:
                  raise ValueError(
                      f"source {spec.source_id!r} option {key!r} "
                      "must contain non-empty text"
                  )
              return result


          def _validate_optional_text_list(spec: SourceSpec, key: str) -> None:
              if key not in spec.options:
                  return
              value = spec.options[key]
              if not isinstance(value, list) or any(
                  not isinstance(item, str) or not item.strip() for item in value
              ):
                  raise ValueError(
                      f"source {spec.source_id!r} option {key!r} "
                      "must contain only non-empty text"
                  )


          def _validate_public_html(spec: SourceSpec) -> None:
              base_url = spec.require_text("url")
              _validate_public_url(base_url, spec.source_id)
              root_host = (urlsplit(base_url).hostname or "").lower()
              domains = _require_text_list(spec, "allowed_domains")
              normalized_domains = {domain.lower() for domain in domains}
              if root_host not in normalized_domains:
                  raise ValueError(
                      f"source {spec.source_id!r} allowed_domains must include "
                      "the listing host"
                  )
              for domain in normalized_domains:
                  if (
                      not _DOMAIN_PATTERN.fullmatch(domain)
                      or domain.startswith(".")
                      or domain.endswith(".")
                      or ".." in domain
                  ):
                      raise ValueError(
                          f"source {spec.source_id!r} has invalid allowed domain "
                          f"{domain!r}"
                      )
              _require_text_list(spec, "job_link_patterns")
              _validate_optional_text_list(spec, "anchor_text_patterns")
              _validate_optional_text_list(spec, "required_anchor_text_patterns")
              _validate_optional_text_list(spec, "exclude_anchor_text_patterns")
              template = str(spec.options.get("page_url_template", "")).strip()
              if template:
                  if "{page}" not in template:
                      raise ValueError(
                          f"source {spec.source_id!r} page_url_template must contain "
                          "'{page}'"
                      )
                  try:
                      rendered = template.format(page=0)
                  except (KeyError, ValueError) as exc:
                      raise ValueError(
                          f"source {spec.source_id!r} has invalid page_url_template"
                      ) from exc
                  _validate_public_url(
                      rendered, spec.source_id, "page_url_template"
                  )
                  rendered_host = (urlsplit(rendered).hostname or "").lower()
                  if rendered_host not in normalized_domains:
                      raise ValueError(
                          f"source {spec.source_id!r} page_url_template is outside "
                          "allowed_domains"
                      )
              spec.int_option("page_start", 0, minimum=0)
              spec.int_option("page_step", 1)
              spec.bool_option("fetch_details", True)
              spec.bool_option("deny_on_robots_error", True)


          '''.replace("          ", "")
          replace_once(
              "src/job_intelligence/source_config.py", marker, helpers + marker
          )
          replace_once(
              "src/job_intelligence/source_config.py",
              '    elif spec.source_type == "oracle_hcm":\n'
              '        _validate_oracle_source(spec)\n'
              '    elif spec.source_type == "smartrecruiters":\n',
              '    elif spec.source_type == "oracle_hcm":\n'
              '        _validate_oracle_source(spec)\n'
              '    elif spec.source_type == "public_html":\n'
              '        _validate_public_html(spec)\n'
              '    elif spec.source_type == "smartrecruiters":\n',
          )
          replace_once(
              "src/job_intelligence/source_config.py",
              '    spec.int_option("max_pages", 100)\n',
              '    spec.int_option("max_pages", 100)\n'
              '    spec.int_option("max_response_bytes", 15_000_000)\n'
              '    spec.int_option("max_redirects", 5, minimum=0)\n',
          )

          replace_once(
              "src/job_intelligence/collection_runner.py",
              "from .collectors import COLLECTORS, collect_sitemap\n",
              "from .collectors import (\n"
              "    COLLECTORS,\n"
              "    collect_public_html,\n"
              "    collect_sitemap,\n"
              ")\n",
          )
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '            if spec.source_type == "sitemap":\n'
              "                result = collect_sitemap(\n"
              "                    spec,\n"
              "                    client,\n"
              '                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n'
              "                )\n"
              "            else:\n",
              '            if spec.source_type == "sitemap":\n'
              "                result = collect_sitemap(\n"
              "                    spec,\n"
              "                    client,\n"
              '                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n'
              "                )\n"
              '            elif spec.source_type == "public_html":\n'
              "                result = collect_public_html(\n"
              "                    spec,\n"
              "                    client,\n"
              '                    respect_robots_txt=source_config.policy["respect_robots_txt"],\n'
              "                )\n"
              "            else:\n",
          )
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '            stage = "health"\n'
              "            record_source_health(\n"
              "                db_path,\n"
              "                spec.source_id,\n"
              "                spec.name,\n"
              '                "pass",\n'
              "                records_found=len(result.jobs),\n"
              "            )\n",
              '            stage = "health"\n'
              '            warning_message = " | ".join(result.warnings)\n'
              '            source_status = (\n'
              '                "pass_with_warnings" if warning_message else "pass"\n'
              '            )\n'
              "            record_source_health(\n"
              "                db_path,\n"
              "                spec.source_id,\n"
              "                spec.name,\n"
              "                source_status,\n"
              "                records_found=len(result.jobs),\n"
              "                error_message=warning_message,\n"
              "            )\n",
          )
          replace_once(
              "src/job_intelligence/collection_runner.py",
              '                    status="pass",\n'
              "                    jobs_collected=len(result.jobs),\n"
              "                    new_jobs=new_jobs,\n"
              "                    updated_jobs=updated_jobs,\n"
              "                )\n",
              "                    status=source_status,\n"
              "                    jobs_collected=len(result.jobs),\n"
              "                    new_jobs=new_jobs,\n"
              "                    updated_jobs=updated_jobs,\n"
              "                    error_message=warning_message,\n"
              "                )\n",
          )

          replace_once(
              "src/job_intelligence/database.py",
              '    success_at = now if status == "pass" else ""\n',
              '    successful = status in {"pass", "pass_with_warnings"}\n'
              '    success_at = now if successful else ""\n',
          )
          replace_once(
              "src/job_intelligence/database.py",
              "                    WHEN excluded.status='pass' THEN excluded.last_success_at\n",
              "                    WHEN excluded.status IN (\n"
              "                        'pass', 'pass_with_warnings'\n"
              "                    ) THEN excluded.last_success_at\n",
          )

          replace_once(
              "pyproject.toml", 'version = "0.2.0"\n', 'version = "0.3.0"\n'
          )
          replace_once(
              "pyproject.toml",
              'dependencies = [\n  "defusedxml>=0.7.1",\n',
              'dependencies = [\n'
              '  "beautifulsoup4>=4.12.3",\n'
              '  "defusedxml>=0.7.1",\n',
          )
          requirements = Path("requirements.txt")
          requirements_text = requirements.read_text(encoding="utf-8")
          if "beautifulsoup4" not in requirements_text:
              requirements.write_text(
                  "beautifulsoup4>=4.12.3\n" + requirements_text,
                  encoding="utf-8",
              )

          Path("tests/test_public_html_review_fixes.py").write_text(
              '''from pathlib import Path

          from job_intelligence.collectors.public_html import _RobotsCache
          from job_intelligence.database import connect, record_source_health


          class FailingRobotsClient:
              user_agent = "test-agent"

              def __init__(self) -> None:
                  self.calls = 0

              def get(self, *_args, **_kwargs):
                  self.calls += 1
                  raise OSError("robots unavailable")


          def test_robots_error_is_cached_for_origin() -> None:
              client = FailingRobotsClient()
              cache = _RobotsCache(client, enabled=True, deny_on_error=True)
              assert cache.can_fetch("https://example.com/jobs/1") is False
              assert cache.can_fetch("https://example.com/jobs/2") is False
              assert client.calls == 1


          def test_pass_with_warnings_updates_success_timestamp(tmp_path: Path) -> None:
              db_path = tmp_path / "jobs.db"
              record_source_health(
                  db_path,
                  "source",
                  "Source",
                  "pass_with_warnings",
                  records_found=1,
                  error_message="detail fallback",
              )
              with connect(db_path) as connection:
                  row = connection.execute(
                      "SELECT status, last_success_at, error_message FROM source_health"
                  ).fetchone()
              assert row["status"] == "pass_with_warnings"
              assert row["last_success_at"]
              assert row["error_message"] == "detail fallback"
          '''.replace("          ", ""),
              encoding="utf-8",
          )
          Path("docs/PUBLIC_HTML_COLLECTOR.md").write_text(
              """# Public HTML Collector

          The `public_html` collector is available for official career pages that do not have a verified supported API. All production HTML sources remain disabled until a source-specific live proof passes.

          Controls include exact domain and link allowlists, bounded pagination and item counts, robots checks using the crawler identity, role/location anchor filters, schema.org parsing, constrained HTML fallback, local raw evidence with SHA-256 verification, and `pass_with_warnings` when a safe listing-only fallback is retained.

          The verified production sources remain the McDermott and Wood Oracle connectors in `config/sources.yaml`. Disabled examples belong in `config/sources.example.yaml`; CI uses `config/sources.ci.yaml` and performs no live collection.
          """.replace("          ", ""),
              encoding="utf-8",
          )

          for workflow in (
              ".github/workflows/apply-employer-integration.yml",
              ".github/workflows/integrate-employer-registry.yml",
          ):
              Path(workflow).unlink(missing_ok=True)
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Integrate verified employer registry and disabled HTML collector"
          git push origin HEAD:agent/integrate-employer-registry
