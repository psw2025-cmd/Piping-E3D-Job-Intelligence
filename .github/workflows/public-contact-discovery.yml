name: Official Hiring Contact Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-contact-discovery.yml"
      - "config/employers_master_verified.yaml"
      - "config/employer_registry.yaml"
      - "config/recruiters.yaml"
      - "pyproject.toml"
      - "src/job_intelligence/public_contacts.py"
      - "src/job_intelligence/contact_quality.py"
  push:
    branches:
      - feat/public-contact-discovery-v1
    paths:
      - ".github/workflows/public-contact-discovery.yml"
      - "config/employers_master_verified.yaml"
      - "config/employer_registry.yaml"
      - "config/recruiters.yaml"
      - "pyproject.toml"
      - "src/job_intelligence/public_contacts.py"
      - "src/job_intelligence/contact_quality.py"

permissions:
  contents: read

concurrency:
  group: official-hiring-contacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Scan official employer and recruiter sources
        run: |
          job-contact-discovery scan \
            --registry config/employers_master_verified.yaml \
            --registry config/employer_registry.yaml \
            --registry config/recruiters.yaml \
            --output "tmp/official-hiring-contacts/shard-${{ matrix.shard }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 8 \
            --workers 16 \
            --max-pages 6 \
            --timeout 12 \
            --rate-limit 60

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: official-hiring-contacts-shard-${{ matrix.shard }}
          path: tmp/official-hiring-contacts/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Merge and quality-gate full global result
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: official-hiring-contacts-shard-*
          path: tmp/official-hiring-contact-shards
          merge-multiple: false

      - name: Merge, clean and verify complete bundle
        run: |
          job-contact-discovery merge \
            --input-root tmp/official-hiring-contact-shards \
            --output tmp/global-official-hiring-contacts
          job-contact-finalize \
            --output tmp/global-official-hiring-contacts
          test -s tmp/global-official-hiring-contacts/Global_Official_Hiring_Contacts.xlsx
          test -s tmp/global-official-hiring-contacts/All_Official_Contacts.csv
          test -s tmp/global-official-hiring-contacts/Official_Job_Mailboxes.csv
          test -s tmp/global-official-hiring-contacts/Official_General_Mailboxes.csv
          test -s tmp/global-official-hiring-contacts/Excluded_Quality.csv
          test -s tmp/global-official-hiring-contacts/summary.json
          test -s tmp/global-official-hiring-contacts/Global_Official_Hiring_Contacts_Bundle.zip
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("tmp/global-official-hiring-contacts/summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["targets_scanned"] > 0
          assert summary["raw_contact_rows"] >= summary["all_official_contacts"]
          assert summary["all_official_contacts"] == summary["unique_emails"]
          assert summary["all_official_contacts"] >= summary["official_job_mailboxes"]
          print(json.dumps(summary, indent=2))
          PY

      - name: Publish full global contact bundle
        uses: actions/upload-artifact@v4
        with:
          name: Global-Official-Hiring-Contacts-Full
          path: tmp/global-official-hiring-contacts/
          if-no-files-found: error
          retention-days: 30
