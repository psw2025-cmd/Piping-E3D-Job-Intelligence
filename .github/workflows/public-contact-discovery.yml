name: Public Contact Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"
  push:
    branches:
      - feat/public-contact-discovery-v1
    paths:
      - ".github/workflows/public-contact-discovery.yml"
      - "config/employers_master_verified.yaml"
      - "config/employer_registry.yaml"
      - "config/recruiters.yaml"
      - "pyproject.toml"
      - "src/job_intelligence/public_contacts.py"

permissions:
  contents: read

jobs:
  scan:
    name: Scan shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Scan public employer and recruiter sources
        run: |
          job-contact-discovery scan \
            --registry config/employers_master_verified.yaml \
            --registry config/employer_registry.yaml \
            --registry config/recruiters.yaml \
            --output "tmp/public-contacts/shard-${{ matrix.shard }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --workers 12 \
            --max-pages 8 \
            --timeout 20 \
            --rate-limit 30

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: global-public-contacts-shard-${{ matrix.shard }}
          path: tmp/public-contacts/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Merge full global result
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: global-public-contacts-shard-*
          path: tmp/public-contact-shards
          merge-multiple: false

      - name: Merge and verify complete bundle
        run: |
          job-contact-discovery merge \
            --input-root tmp/public-contact-shards \
            --output tmp/global-public-contacts
          test -s tmp/global-public-contacts/Global_Public_Contacts.xlsx
          test -s tmp/global-public-contacts/All_Public_Contacts.csv
          test -s tmp/global-public-contacts/summary.json
          test -s tmp/global-public-contacts/Global_Public_Contacts_Bundle.zip
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("tmp/global-public-contacts/summary.json").read_text(encoding="utf-8")
          )
          assert summary["targets_scanned"] > 0
          assert summary["all_public_contacts"] >= summary["verified_job_contacts"]
          print(json.dumps(summary, indent=2))
          PY

      - name: Publish full global contact bundle
        uses: actions/upload-artifact@v4
        with:
          name: Global-Public-Contacts-Full
          path: tmp/global-public-contacts/
          if-no-files-found: error
          retention-days: 30
