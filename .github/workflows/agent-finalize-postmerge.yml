name: agent-finalize-postmerge-review-fixes

on:
  push:
    branches:
      - agent/fix-postmerge-review-findings

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-postmerge-review-findings
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Make URL enrichment contract explicit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_database_integrity.py")
          text = path.read_text(encoding="utf-8")
          old = '''        description=initial.description,\n        apply_url="https://example.com/jobs/123?utm_source=mail",\n    )\n    assert upsert_job(db_path, enriched) is False\n'''
          new = '''        description=initial.description,\n        apply_url="https://example.com/jobs/123?utm_source=mail",\n        job_key=original_key,\n    )\n    assert upsert_job(db_path, enriched) is False\n'''
          if text.count(old) != 1:
              raise SystemExit("Expected URL-enrichment test block was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          diagnostic = Path("agent_fix_diagnostic.txt")
          if diagnostic.exists():
              diagnostic.unlink()
          Path(".github/workflows/agent-finalize-postmerge.yml").unlink()
          PY

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Full verification
        shell: bash
        run: |
          git diff --check
          ruff check src tests
          pytest -q
          rm -rf tmp
          job-intel --db tmp/jobs.db init-db
          job-intel --db tmp/jobs.db export --output tmp/Piping_E3D_Jobs.xlsx
          job-intel --db tmp/jobs.db verify --output tmp/Piping_E3D_Jobs.xlsx
          rm -rf tmp

      - name: Commit verified final fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_database_integrity.py agent_fix_diagnostic.txt .github/workflows/agent-finalize-postmerge.yml
          git commit -m "Finalize post-merge identity and scoring fixes"
          git push origin HEAD:agent/fix-postmerge-review-findings
