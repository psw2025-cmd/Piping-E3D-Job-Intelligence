name: daily-live-job-intelligence

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-live-job-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Collect and verify official sources
        id: daily
        continue-on-error: true
        run: python scripts/run_cloud_daily.py --output output/daily

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f output/daily/SUMMARY.md ]; then
            cat output/daily/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Daily Piping/E3D Job Intelligence" >> "$GITHUB_STEP_SUMMARY"
            echo "Runner did not produce SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verified daily artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: piping-e3d-jobs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/daily/SUMMARY.md
            output/daily/status.json
            output/daily/run.log
            output/daily/Piping_E3D_Daily_Bundle.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Enforce verified success
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path("output/daily/status.json")
          if not status_path.exists():
              raise SystemExit("Daily runner did not create status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          exit_code = int(status.get("exit_code", 2))
          if exit_code != 0:
              raise SystemExit(
                  f"Daily collection failed: {status.get('error') or status.get('collection_status')}"
              )
          print("PASS: daily collection, evidence and workbook verification completed")
          PY
